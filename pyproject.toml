[tool.ruff]
target-version = "py312"
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "N", "DJ", "UP", "SIM", "RET"]
ignore = ["DJ012"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "N806"]
"tests.py" = ["N802"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "constructor_express.settings"
python_files = ["tests.py", "test_*.py"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["budgets", "clients", "catalog", "users", "common"]
omit = ["*/migrations/*", "*/tests.py", "manage.py"]

[tool.coverage.report]
fail_under = 75
skip_covered = true
show_missing = true

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]
