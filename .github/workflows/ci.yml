name: CI

on: [push, pull_request]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit detect-secrets
      - run: detect-secrets scan > .secrets.baseline
      - run: SKIP=detect-secrets pre-commit run --all-files

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: constructor_express_db
          POSTGRES_USER: ce_user

          POSTGRES_PASSWORD: testpass  # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-secret-key-not-used-in-prod  # pragma: allowlist secret
      DEBUG: "True"
      DB_NAME: constructor_express_db
      DB_USER: ce_user
      DB_PASS: testpass  # pragma: allowlist secret
      DB_HOST: localhost

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run migrations
        run: python manage.py migrate
      - name: Run tests with coverage
        run: pytest --cov --cov-fail-under=75 --cov-report=xml
