<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña — Constructor Express</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 90'><rect x='0' y='0' width='100' height='90' rx='18' fill='%231d3461'/><path d='M18 64 Q18 24 50 24 Q82 24 82 64 Z' fill='%23fbbf24'/><rect x='10' y='61' width='80' height='13' rx='6' fill='%23e07a1f'/><path d='M30 61 Q50 55 70 61' fill='none' stroke='%23d97706' stroke-width='3'/></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    * { -webkit-font-smoothing: antialiased; }
    body { font-family: 'Inter', sans-serif; }
    [data-lucide] { display: inline-block; flex-shrink: 0; }
    .input-field {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      border: 2px solid #e8ecf5;
      border-radius: 0.875rem;
      color: #1e293b;
      font-size: 0.875rem;
      font-weight: 500;
      outline: none;
      transition: all 0.2s;
      background: #f8fafd;
    }
    .input-field:focus {
      border-color: #1d3461;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(29,52,97,0.08);
    }
    .input-field::placeholder { color: #94a3b8; font-weight: 400; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6" style="background:#f0f2f8">
  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-10">
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-2xl mx-auto mb-5 flex items-center justify-center"
           style="background:linear-gradient(135deg,#1d3461,#25407a);box-shadow:0 8px 24px rgba(29,52,97,0.4)">
        <i data-lucide="lock-keyhole" class="w-8 h-8 text-white"></i>
      </div>
      <h1 class="text-2xl font-black text-slate-900 mb-2">Crea tu nueva contraseña</h1>
      <p class="text-slate-500 text-sm">Elige una contraseña segura que no uses en otros sitios.</p>
    </div>

    {% if form.errors %}
      <div class="mb-5 rounded-2xl bg-red-50 border border-red-100 px-4 py-3 space-y-1">
        {% for field, errors in form.errors.items %}
          {% for error in errors %}
            <div class="flex items-start gap-2 text-sm text-red-700">
              <i data-lucide="x-circle" class="w-4 h-4 flex-shrink-0 mt-0.5"></i>
              <span>{{ error }}</span>
            </div>
          {% endfor %}
        {% endfor %}
      </div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}

      <div>
        <label class="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider">
          Nueva contraseña
        </label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input type="password" name="new_password1" required autofocus
                 class="input-field" placeholder="••••••••">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider">
          Confirmar contraseña
        </label>
        <div class="relative">
          <i data-lucide="lock-keyhole" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input type="password" name="new_password2" required
                 class="input-field" placeholder="••••••••">
        </div>
      </div>

      <ul class="text-xs text-slate-500 space-y-1 pl-1 pt-1">
        <li class="flex items-center gap-1.5"><i data-lucide="check" class="w-3.5 h-3.5" style="color:#1d3461"></i> Mínimo 8 caracteres</li>
        <li class="flex items-center gap-1.5"><i data-lucide="check" class="w-3.5 h-3.5" style="color:#1d3461"></i> Que no sea demasiado común</li>
      </ul>

      <div class="pt-3">
        <button type="submit"
                class="w-full py-3.5 rounded-2xl font-bold text-base text-white flex items-center justify-center gap-2.5 transition-all duration-200 relative overflow-hidden group"
                style="background:linear-gradient(135deg,#1d3461 0%,#25407a 100%);box-shadow:0 6px 20px rgba(29,52,97,0.4)">
          <span class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-300"
                style="background:linear-gradient(135deg,#25407a 0%,#2e5097 100%)"></span>
          <span class="relative flex items-center gap-2">
            Actualizar contraseña
            <i data-lucide="check-circle-2" class="w-5 h-5"></i>
          </span>
        </button>
      </div>
    </form>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
