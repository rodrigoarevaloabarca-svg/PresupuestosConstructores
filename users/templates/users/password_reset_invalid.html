<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enlace no válido — Constructor Express</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 90'><rect x='0' y='0' width='100' height='90' rx='18' fill='%231d3461'/><path d='M18 64 Q18 24 50 24 Q82 24 82 64 Z' fill='%23fbbf24'/><rect x='10' y='61' width='80' height='13' rx='6' fill='%23e07a1f'/><path d='M30 61 Q50 55 70 61' fill='none' stroke='%23d97706' stroke-width='3'/></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    * { -webkit-font-smoothing: antialiased; }
    body { font-family: 'Inter', sans-serif; }
    [data-lucide] { display: inline-block; flex-shrink: 0; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6" style="background:#f0f2f8">
  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-10 text-center">
    <div class="w-20 h-20 rounded-3xl mx-auto mb-6 flex items-center justify-center"
         style="background:linear-gradient(135deg,#dc2626,#ef4444);box-shadow:0 10px 30px rgba(220,38,38,0.35)">
      <i data-lucide="link-2-off" class="w-10 h-10 text-white"></i>
    </div>

    <h1 class="text-2xl font-black text-slate-900 mb-3">Enlace no válido</h1>
    <p class="text-slate-600 text-sm leading-relaxed mb-2">
      Este enlace de recuperación ya fue usado o expiró.
    </p>
    <p class="text-slate-500 text-xs mb-8">
      Los enlaces son válidos por 24 horas y se pueden usar solo una vez.
    </p>

    <a href="{% url 'password_reset_request' %}"
       class="inline-flex w-full items-center justify-center gap-2 py-3.5 rounded-2xl font-bold text-base text-white transition-all duration-200"
       style="background:linear-gradient(135deg,#1d3461 0%,#25407a 100%);box-shadow:0 6px 20px rgba(29,52,97,0.4)">
      <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
      Solicitar nuevo enlace
    </a>

    <a href="{% url 'login' %}" class="block text-slate-400 text-xs mt-6 hover:text-slate-600 transition-colors">
      Volver a iniciar sesión
    </a>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
